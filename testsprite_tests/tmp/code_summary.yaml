project_name: LogiStock Solutions
project_type: backend
description: >
  REST API backend for a Warehouse Management System (WMS) built with Node.js,
  Express and TypeScript. Supports JWT authentication, role-based access control,
  email notifications via Resend, and payment processing via Wompi payment gateway.

tech_stack:
  runtime: Node.js (ESM)
  language: TypeScript
  framework: Express 5
  database: PostgreSQL via Sequelize ORM
  authentication: JWT (access + refresh tokens)
  email: Resend
  payment_gateway: Wompi
  testing: Vitest

server:
  port: 3000
  base_path: /api

features:
  - name: Authentication
    endpoints:
      - POST /api/auth/register
      - POST /api/auth/login
      - POST /api/auth/refresh
      - POST /api/auth/logout
    description: >
      Register new users with CLIENT role, login with JWT tokens,
      refresh access tokens, logout by revoking refresh tokens.
      Account lockout after 5 failed attempts. Login alert email on every login.

  - name: User Management
    endpoints:
      - GET /api/users         # ADMIN only
      - GET /api/users/me      # own profile
      - GET /api/users/:id     # own or ADMIN
      - PUT /api/users/:id     # update profile
      - PATCH /api/users/:id/password
      - DELETE /api/users/:id  # ADMIN only - deactivates account
    description: Profile management and user administration.

  - name: Role Management
    endpoints:
      - GET /api/roles         # ADMIN only
      - GET /api/roles/:id     # ADMIN only
    description: List system roles (admin, warehouse_manager, operator, client).

  - name: Wompi Payment Gateway
    endpoints:
      - POST /api/wompi/signature         # generate integrity hash for widget
      - GET  /api/wompi/transactions/:id  # query transaction status
      - POST /api/wompi/webhook           # receive Wompi webhook events (public)
    description: >
      Generates SHA-256 integrity signatures for the Wompi widget.
      Receives and verifies webhook events. Persists all transactions to DB.

models:
  - Role: id, name (enum), description
  - User: id, roleId, firstName, lastName, phone, email, password, isActive, isVerified, lastLogin
  - RefreshToken: id, userId, token, expiresAt, isRevoked, ipAddress, userAgent
  - LoginAttempt: id, userId, email, success, ipAddress, userAgent, attemptedAt
  - PaymentTransaction: id, wompiId, reference, status, amountInCents, currency, paymentMethodType, environment, finalizedAt, rawPayload

roles:
  - admin
  - warehouse_manager
  - operator
  - client

security:
  - JWT Bearer token required on all /api/users and /api/roles routes
  - /api/auth/* routes are public
  - /api/wompi/webhook is public (verified via SHA-256 checksum)
  - /api/wompi/signature and /api/wompi/transactions/:id require JWT
